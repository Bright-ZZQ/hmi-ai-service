[info]
ID = "{{APP_ID}}"
name = "{{APP_NAME_CN}}"
#应用类型（legacy-传统应用；container-容器应用）
type = "legacy"
version = "{{APP_VERSION}}"
solution = ""
funcDesc = "{{FUNC_DESC}}"
releaseNote = "V{{APP_VERSION}} release"
source = "Hollysys"
appMode = "standard"
#严格模式（true-严格模式；false-正常模式）
strictMode = false
supSysType = ["Ubuntu 22.04 LTS Server", "Kylin Server V10"]
#应用所属的应用集名称
appsets = "{{APP_NAME_CN}}"

[execute]
programType = "java"
#是否特权模式运行，默认false
privileged = true
#启动文件名称
startProgramName = "bin/start.sh"
#启动参数
startParams = []
#停止文件名称
stopProgramName = "bin/stop.sh"
#数据存储目录列表
dataDir = [  ]

#运行时提供环境变量
[execute.env]
"DB_TYPE"="${DB_DATASOURCE}"
"DB_HOST"="${ip:database}"
"DB_PORT"="${def:DB_PORT}"
"DB_USER"="${def:DB_UID}"
"DB_PWD"="${def:DB_PWD}"

#守护和健康检查配置
[[execute.programs]]
progName = "bin/{{APP_JAR}}"
progParams = []
#程序是否需要守护（true-不需要守护；false-需要守护），默认false
notNeedGuard = false
# [方式一] http 健康检查（默认启用）
healthCheckAliveType = "http"
healthCheckAliveInterface = "v1/healthz"
healthCheckAliveHttpPort = "{{TCP_PORT}}"
healthCheckReadyType = "http"
healthCheckReadyInterface = "v1/healthz"
healthCheckReadyHttpPort = "{{TCP_PORT}}"
# [方式二] tcp 健康检查（与方式一二选一，如需使用请注释上方 http 配置并取消以下注释）
# healthCheckAliveType = "tcp"
# healthCheckAliveInterface = ""
# healthCheckAliveTcpPort = "{{TCP_PORT}}"
# healthCheckReadyType = ""
# healthCheckReadyInterface = ""
aliveDelaySeconds = 120
aliveTimeoutSeconds = 5
alivePeriodSeconds = 10
readyDelaySeconds = 150
readyTimeoutSeconds = 5
readyPeriodSeconds = 15

# 配置平台中间件代理
[execute.extend]
mwNeedPorxy="true"

# 将需要代理的方法配置到中间件
[[execute.extend.mwMethod]]
path = "/v1/healthz"
requestMethod = "GET"
type = ""
name = "服务健康检测"
