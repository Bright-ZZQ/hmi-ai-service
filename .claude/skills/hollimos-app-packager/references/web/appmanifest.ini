[info]
#基本信息
ID = "{{APP_ID}}"
#应用显示名称
name = "{{APP_NAME_CN}}"
#应用类型（legacy-传统应用；container-容器应用）
type = "legacy"
#版本号
version = "{{APP_VERSION}}"
#行业解决方案
solution = ""
funcDesc = "{{FUNC_DESC}}"
releaseNote = "V{{APP_VERSION}} release"
source = "Hollysys"
appMode = "standard"
#严格模式（true-严格模式；false-正常模式）
strictMode = false
#支持Linux系统的发行版类型
supSysType = ["Ubuntu 22.04 LTS Server", "Kylin Server V10"]
#应用集名称
appsets = "{{APP_NAME_CN}}"

[execute]
programType = "web"
privileged = false
#启动文件名称
startProgramName = "files/"
#启动参数（web应用，指定web资源文件url）
startParams = [ "/{{APP_ID}}" ]

#web前端路由配置（programType=web时，此配置生效）
[execute.web]
#web前端路由模式（hash、history）—由路由模式自动检测决定
mode = "{{ROUTE_MODE}}"

# 主路由配置
[[execute.web.routes]]
path = "/{{APP_ID}}"
#hash模式使用alias，history模式使用try_files
type = "{{ROUTE_TYPE}}"
target = "files/"

# 打包规范要求配置：history模式保留，hash模式删除此块
[[execute.web.routes]]
path = "/{{APP_ID}}-{{APP_VERSION}}/files"
type = "alias"
target = "files/"

# http 服务（按需保留，如无后端可删除）
[[execute.web.routes]]
path = "/{{APP_ID}}/api/v1"
type = "custom"
target = "${ip:{{BACKEND_SERVER}}}:{{BACKEND_PORT}}"
content = """proxy_pass ${target};
client_max_body_size 100M;
rewrite ^/{{APP_ID}}/(.*)$ /$1 break;"""

# websocket（按需保留，如无 websocket 可删除）
[[execute.web.routes]]
path = "/{{APP_ID}}/ws/v1"
type = "custom"
target = "${ip:{{BACKEND_SERVER}}}:{{BACKEND_PORT}}"
targetFilter = ""
content = """proxy_pass ${target};
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
rewrite ^/{{APP_ID}}/(.*)$ /$1 break;"""
