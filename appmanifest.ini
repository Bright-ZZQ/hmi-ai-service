[info]
ID = "hmi-ai-svc"
name = "HMI AI服务"
name_en = "HMI AI Service"
#应用类型(legacy-传统应用; container-容器应用)
type = "legacy"
version = "1.0.0"
solution = ""
funcDesc = "图形组态AI服务"
releaseNote = "V1.0.0 release"
source = "Hollysys"
appMode = "standard"
#严格模式(true-严格模式；false-正常模式)
strictMode = false
supSysType = ["Ubuntu 22.04 LTS Server"]
#应用所属的应用集名称
appsets = "图形组态AI服务"
appsets_en = "HMI-AI-SVC"

#服务依赖
[[info.appDependency]]
appIdVersion = "hmi-editor-svc-*"
#依赖类型（strong-强依赖；weak-弱依赖）
dependencyType = "weak"

[execute]
#程序类型(java、exec、web、dotnet、nodejs、python、container)
programType = "nodejs"
#是否特权模式运行，默认false
privileged = false
#启动文件名称
startProgramName = "bin/start.sh"
#启动参数
startParams = []
#停止文件名称
stopProgramName = "bin/stop.sh"
#数据存储目录列表
dataDir = [ ]

#守护和健康检查配置
[[execute.programs]]
progName = "bin/hmi-ai-svc"
progParams = []
#程序是否需要守护（true-不需要守护；false-需要守护），默认false
notNeedGuard = false
# [方式一] tcp 健康检查（默认启用）
healthCheckAliveType = "tcp"
healthCheckAliveInterface = ""
healthCheckAliveTcpPort = "3100"
healthCheckReadyType = ""
healthCheckReadyInterface = ""
aliveDelaySeconds = 10
aliveTimeoutSeconds = 2
alivePeriodSeconds = 5
readyDelaySeconds = 15
readyTimeoutSeconds = 2
readyPeriodSeconds = 5

#端口号列表
[[execute.ports]]
sourcePort = ""
targetPort = "3100"
